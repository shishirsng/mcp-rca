[project]
name = "reposleuth"
version = "0.1.0"
description = "RepoSleuth: Evidence-Based Debugging Agent using MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-mcp-adapters>=0.1.0,<0.2.0",
    "langchain-ollama>=0.3.0,<0.4.0",
    "langchain-google-genai>=2.1.0,<3.0.0",
    "langgraph>=0.4.0,<0.5.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "pytest>=8.0.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
